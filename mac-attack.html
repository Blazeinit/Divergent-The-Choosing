  if (ST && !['farm', 'ending', 'travel', 'kick', 'perk', 'lb', 'ach', 'fail'].includes(state)) { g.globalCompositeOperation = 'soft-light'; g.globalAlpha = .22; g.fillStyle = THEMES[ST.theme].neon; g.fillRect(0, 0, W, H); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
  g.restore();
  // animated film grain
  if (!grainC) { grainC = document.createElement('canvas'); grainC.width = grainC.height = 128; grainC.x = grainC.getContext('2d'); grainC.img = grainC.x.createImageData(128, 128); }
  if (grainN++ % 3 === 0) { const d = grainC.img.data; for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; } grainC.x.putImageData(grainC.img, 0, 0); }
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'overlay'; g.globalAlpha = .07; g.fillStyle = g.createPattern(grainC, 'repeat'); g.fillRect(0, 0, cv.width, cv.height); g.restore();
}

// ---------- input ----------
function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
}
cv.addEventListener('pointermove', e => { mouse = canvasPos(e); });
cv.addEventListener('pointerdown', () => { mdown = true; }); addEventListener('pointerup', () => { mdown = false; }); addEventListener('pointercancel', () => { mdown = false; });
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); beep(1, .01, 'sine', .0001); const [x, y] = canvasPos(e); mouse = [x, y];
  if (TOUCH && !document.fullscreenElement && document.documentElement.requestFullscreen) { try { document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}); screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {}); } catch (e2) {} }
  for (const b of btns) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; }
  if (paused) return;
  if (state === 'travel') { collectAt(x, y); return; }
  if (state === 'tab') {
    if (monkey && !monkey.hit && Math.hypot(x - monkey.x - 8, y - monkey.y + 10) < 56) { swatMonkey(); return; }
    for (let i = 0; i < bills.length; i++) if (x >= billX(bills[i].slot) && x <= billX(bills[i].slot) + 100 && y >= 400 && y <= 530) { pay(i); return; }
  } else if (state === 'vs') { for (let i = 0; i < bills.length; i++) if (!bills[i].done && x >= billX(bills[i].slot) && x <= billX(bills[i].slot) + 100 && y >= 400 && y <= 530) { vsPay(i); return; } }
  else if (state === 'wait') { if (Math.hypot(x - 640, y - 262) < 70) ringBell(); }
  else if (state === 'story') storyAdvance();
  else if (state === 'summary' || state === 'kick' || (state === 'ending' && endT > 1 && endT < 15.5)) primary();
});
addEventListener('keydown', e => {
  beep(1, .01, 'sine', .0001);
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (paused) return;
  if (e.code === 'KeyS') useSlow();
  if (e.code === 'KeyX') useShout();
  if (e.code === 'KeyC') useSunscreen();
  if (e.code === 'KeyB') swatMonkey();
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); ringBell(); }
  // test hotkeys: E = jump to the ending, N = force-clear current stage, F = force-fail current stage
  if (state !== 'title' || e.code === 'KeyE') {
    if (e.code === 'KeyE') { camp = { stage: STAGES.length, invested: 61300, stars: [3, 2, 3, 2, 3, 2], strikes: 3, fails: 0, diff: 1, flags: {}, log: [] }; clearInfo = null; startEnding(); }
    else if (e.code === 'KeyN' && ['wait', 'tab', 'summary', 'intro'].includes(state)) { if (state === 'intro') prepStage(); bills = []; spawnQ = []; cash = START_CASH + GOAL * 2; stageClear(); }
    else if (e.code === 'KeyF' && ['wait', 'tab', 'summary'].includes(state)) { cash = 0; endReason = 'bankrupt'; startKick('bankrupt'); }
  }
  if (state === 'vs' && e.code in VSCODE) { vsPay(bills.findIndex(b => b.slot === VSCODE[e.code] && !b.done)); return; }
  { const n0 = parseInt(e.key); if (state === 'story' && story && story.lines[sIdx].ch && sChars >= story.lines[sIdx].t.length && n0 >= 1 && n0 <= story.lines[sIdx].ch.length) { pickChoice(n0 - 1); return; } }
  const n = parseInt(e.key); if (state === 'tab' && n >= 1 && n <= 8) pay(bills.findIndex(b => b.slot === n - 1 && !b.done));
});

document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'tab') paused = true; });
camp = defaultCamp(); prepStage(); toTitle();
let last = performance.now();
(function loop(now) {
  try { if (!paused) update(Math.max(0, Math.min(.05, (now - last) / 1000))); last = now; draw(); } catch (e) { last = now; window.dispatchEvent(new ErrorEvent('error', { message: e.message })); }
  requestAnimationFrame(loop);
})(last);
</script>
