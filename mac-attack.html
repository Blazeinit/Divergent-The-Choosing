<script>
// MAC ATTACK — Bangkok, 2am. Ring the bell, buy the bar a round, then pay every tab FAST.
// Pay quickly = admirers repay you more than the bill. Pay slowly = you lose money.

// ---------- audio ----------
let ac;

// ---------- game flow ----------
// ---------- campaign data ----------

  { name: 'PATONG BEACH BAR', short: 'PATONG BEACH', place: 'Phuket', stake: 12000, target: 3500, rounds: 5, extra: 0, lifeM: 1, amtM: 1.1, theme: 1, build: 'Chicken Coop & Fence' },
  { name: 'TIKI NIGHT MARKET', short: 'NIGHT MARKET', place: 'Chiang Mai', stake: 14000, target: 4500, rounds: 5, extra: 1, lifeM: .98, amtM: 1.15, theme: 2, build: 'Red Barn, Rice Field & Tractor' },
  { name: 'SKYLINE LOUNGE', short: 'SKYLINE', place: 'Pattaya', stake: 17000, target: 6000, rounds: 6, extra: 1, lifeM: .96, amtM: 1.25, theme: 3, build: 'Farmhouse, Pond & Trees' },
  { name: 'AQUA POOL CLUB', short: 'AQUA CLUB', place: 'Koh Samui', stake: 20000, target: 8000, rounds: 6, extra: 1, lifeM: .94, amtM: 1.35, theme: 4, build: 'Luxury Villa & Gardens' },
  { name: 'ROYAL CASINO VIP', short: 'ROYAL CASINO', place: 'Bangkok', stake: 25000, target: 10000, rounds: 7, extra: 2, lifeM: .92, amtM: 1.5, theme: 5, build: 'The Mansion, Pool & Gates' },
];
const THEMES = [
  { wall: ['#4a1c2a', '#2a0f18', '#120609'], neon: '#ff4fa3', neon2: '#ffd54a', L: ['CHANG', '#39ff6a', '#0b2a12'], R: ['SINGHA', '#ff5148', '#2a0808'], cone: '255,190,100' },
  { wall: ['#12526b', '#0e3249', '#071a28'], neon: '#3df0ff', neon2: '#ffb347', L: ['LEO', '#ffb300', '#2a1a00'], R: ['SINGHA', '#ff5148', '#2a0808'], cone: '255,170,90' },
  { wall: ['#5a2410', '#34140a', '#180803'], neon: '#ff8a1f', neon2: '#ffe066', L: ['CHANG', '#39ff6a', '#0b2a12'], R: ['LEO', '#ffb300', '#2a1a00'], cone: '255,140,60' },
  { wall: ['#2a1458', '#190c3a', '#0a0620'], neon: '#b66bff', neon2: '#3df0ff', L: ['SINGHA', '#ff5148', '#2a0808'], R: ['CHANG', '#39ff6a', '#0b2a12'], cone: '190,150,255' },
  { wall: ['#0b6b78', '#08454f', '#032126'], neon: '#5affea', neon2: '#ffffff', L: ['LEO', '#ffb300', '#2a1a00'], R: ['CHANG', '#39ff6a', '#0b2a12'], cone: '140,255,240' },
  { wall: ['#5a0f18', '#350a10', '#16040a'], neon: '#ffd54a', neon2: '#ff4040', L: ['SINGHA', '#ff5148', '#2a0808'], R: ['CHANG', '#39ff6a', '#0b2a12'], cone: '255,215,120' },
];
const TIPS = ['Pay while the bar is green — that\'s up to 1.5x back!', 'A tab in the red pays under 1x. Click early!', 'Keep a combo: fast pays stack up to +50%.', 'Number keys are faster than the mouse.', 'A late tab costs 125%. Never let one expire.', 'Only ring the bell when you\'re ready.'];
const SAVEKEY = 'macattack_save_v1';

// ---------- game flow ----------

}

  const profit = cash - START_CASH, r = profit / ST.target, stars = r >= 1.9 ? 3 : r >= 1.4 ? 2 : 1;
  clearInfo = { profit, stars }; camp.invested += profit; camp.stars[camp.stage] = stars; camp.stage++; saveCamp();
  state = 'clear'; [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .25, 'triangle', .1), i * 140));

  if (state === 'title') { saved ? continueCamp() : newCampaign(); }

  else if (state === 'summary') state = 'wait';
  else if (state === 'clear') toFarm();
  else if (state === 'farm') { if (camp.stage >= STAGES.length) startEnding(); else goIntro(); }
  else if (state === 'ending') { if (endT < 15.5) endT = 15.5; else toTitle(); }

function ringBell() {
  if (state !== 'wait') { if (state !== 'tab') primary(); return; }
  round++; roundNet = 0; bellAnim = 1; shake = 6; ding();

  const slots = [0, 1, 2, 3, 4, 5, 6, 7].sort(() => Math.random() - .5).slice(0, n);   // random tab positions
  for (let i = 0; i < n; i++) {
    const amt = Math.round((200 + Math.random() * 1100) * (1 + round * .18) * ST.amtM / 50) * 50;
    spawnQ.push({ at: t + .1 + Math.random() * 1.8, amt, life: Math.max(2.8, life * (.7 + Math.random() * .75)), slot: slots[i] });
  }
  spawnQ.sort((a, b) => a.at - b.at);
  state = 'tab';
  for (let i = 0; i < 25; i++) coin(450, 120);
}

function startKick(reason) {
  endReason = reason; state = 'kick'; kickT = 0; kickFlags = {}; coinAcc = 0; shake = 10;
  bills = []; spawnQ = []; combo = 0;
  [0, 160, 320, 480].forEach((d, i) => setTimeout(() => beep(i % 2 ? 700 : 950, .14, 'sawtooth', .07), d));
}
function checkBroke() { if (state === 'tab' && cash <= 0) startKick('bankrupt'); }
function pay(i) {
  const b = bills[i]; if (!b || b.done || state !== 'tab') return;
  const frac = Math.max(0, b.left / b.life);
  const mult = .6 + .9 * frac;                       // 1.5x (instant) .. 0.6x (last second)
  const fast = frac > .45;
  combo = fast ? combo + 1 : 0;
  const bonus = 1 + .1 * Math.min(combo - 1, 5) * (fast ? 1 : 0);
  const back = Math.round(b.amt * mult * bonus);
  cash += back - b.amt; roundNet += back - b.amt;
  b.done = true; b.res = back - b.amt;
  const x = billX(b.slot) + 50;
  floatText(x, 360, (b.res >= 0 ? '+' : '-') + CUR + Math.abs(b.res), b.res >= 0 ? '#7CFF7C' : '#ff6b6b');
  if (combo > 1) floatText(x, 335, 'COMBO x' + combo, '#ffd54a');
  for (let k = 0; k < (b.res >= 0 ? 14 : 4); k++) coin(x, 420);
  beep(b.res >= 0 ? 660 + frac * 500 : 200, .12, 'square', .06);
  checkBroke();
}
function expire(b) {
  const loss = Math.round(b.amt * 1.25);              // late fee
  cash -= loss; roundNet -= loss; combo = 0; shake = 8; b.done = true; b.res = -loss; b.late = true;
  floatText(billX(b.slot) + 50, 360, '-' + CUR + loss + ' LATE', '#ff4040');
  beep(120, .3, 'sawtooth', .08, .5);
}
function billX(i) { return 22 + i * 108; }
function floatText(x, y, s, c) { floats.push({ x, y, s, c, a: 1 }); }
function coin(x, y) { parts.push({ x, y, vx: (Math.random() - .5) * 6, vy: -Math.random() * 7 - 2, life: 1, rot: Math.random() * 6, vr: (Math.random() - .5) * .5, bill: Math.random() < .3 }); }

function update(dt) {
  t += dt; bellAnim = Math.max(0, bellAnim - dt * 1.5); shake = Math.max(0, shake - dt * 25); dispCash += (cash - dispCash) * Math.min(1, dt * 8);
  while (spawnQ.length && spawnQ[0].at <= t) {
    const s = spawnQ.shift(); bills.push({ amt: s.amt, life: s.life, left: s.life, slot: s.slot, done: false }); beep(900, .05, 'triangle', .05);
  }
  if (state === 'tab') {
    for (const b of bills) if (!b.done) { b.left -= dt; if (b.left <= 0) expire(b); }
    checkBroke();
    if (state === 'tab' && !spawnQ.length && bills.length && bills.every(b => b.done)) {
      bills = [];
      if (round >= ROUNDS) { if (cash >= START_CASH + ST.target) stageClear(); else startKick('poor'); }
      else state = 'summary';
    }
  }
  if (state === 'kick') {
    kickT += dt;
    if (kickT > 1.4 && kickT < 3.5) { coinAcc += dt; if (coinAcc > .08) { coinAcc = 0; coin(manPos[0], manPos[1] + 30); } }
    if (kickT > 3.7 && !kickFlags.thud) { kickFlags.thud = true; shake = 22; beep(70, .5, 'sine', .3, .4); beep(55, .6, 'square', .1, .5); }
    if (kickT > 4.9 && !kickFlags.sad) { kickFlags.sad = true; [330, 262, 196, 131].forEach((f, i) => setTimeout(() => beep(f, .35, 'triangle', .1), i * 250)); }
    if (kickT > 7.4) enterFail();

  for (const f of floats) { f.y -= 30 * dt; f.a -= dt * .7; }
  floats = floats.filter(f => f.a > 0);
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += .4; p.life -= dt * .8; p.rot += p.vr; }
  parts = parts.filter(p => p.life > 0);

// ---------- drawing (smooth, lit, post-processed) ----------
cv.width = W * SC; cv.height = H * SC;
const bl1 = document.createElement('canvas'); bl1.width = W / 3; bl1.height = H / 3; const b1 = bl1.getContext('2d');
const bl2 = document.createElement('canvas'); bl2.width = W / 8; bl2.height = H / 8; const b2 = bl2.getContext('2d');

function lg(x0, y0, x1, y1, st) { const gr = g.createLinearGradient(x0, y0, x1, y1); st.forEach((s, i) => gr.addColorStop(i / (st.length - 1), s)); return gr; }

// ---------- character rig: inked cartoon sprites with 2-bone IK limbs, blinking, lip-shapes & pose animation ----------
const INK = '#1b0f12';

}

  g.fillStyle = col; g.fill(); g.strokeStyle = INK; g.lineWidth = 2; g.stroke(); g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(-8, 3, 23, 2.5); g.restore();

function canvasPos(e) {
