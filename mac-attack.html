<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mac Attack</title>
<style>
  html,body{margin:0;background:#0a0710;height:100%;display:flex;align-items:center;justify-content:center;font-family:monospace}
  canvas{max-width:100vw;max-height:100vh;background:#1b0f0f;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" width="900" height="560"></canvas>
<script>
// MAC ATTACK — Bangkok, 2am. Ring the bell, buy the bar a round, then pay every tab FAST.
// Pay quickly = admirers repay you more than the bill. Pay slowly = you lose money.
// Go broke (or finish the night poorer) and security throws you out.
const cv = document.getElementById('c'), g = cv.getContext('2d');
const SC = 2, W = 900, H = 560, ROUNDS = 10, START_CASH = 10000, CUR = '฿';

let state = 'title';           // title | wait | tab | summary | kick | over
let cash, round, combo, bills, floats, parts, bellAnim, t = 0, roundNet, best = 0, spawnQ;
let shake = 0, dispCash = 10000, endReason = 'win', kickT = 0, kickFlags = {}, coinAcc = 0, manPos = [426, 200];
try { best = +localStorage.getItem('macattack_best') || 0; } catch (e) {}

// ---------- audio ----------
let ac;
function beep(f, d = .1, type = 'square', v = .05, slide = 0) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), a = ac.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, ac.currentTime + d);
    a.gain.value = v; a.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.connect(a); a.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
const ding = () => { beep(1568, .6, 'sine', .12); setTimeout(() => beep(2093, .5, 'sine', .08), 60); };

// ---------- game flow ----------
function newGame() {
  cash = START_CASH; dispCash = START_CASH; shake = 0; round = 0; combo = 0; bills = []; floats = []; parts = []; spawnQ = [];
  bellAnim = 0; roundNet = 0; state = 'wait';
}
function ringBell() {
  if (state === 'title' || state === 'over') { newGame(); return; }
  if (state === 'kick') { if (kickT > 2) state = 'over'; return; }
  if (state === 'summary') { state = 'wait'; return; }
  if (state !== 'wait') return;
  round++; roundNet = 0; bellAnim = 1; shake = 6; ding();
  const n = Math.min(2 + round, 8), life = Math.max(3.2, 7.5 - round * .4);
  const slots = [0, 1, 2, 3, 4, 5, 6, 7].sort(() => Math.random() - .5).slice(0, n);   // random tab positions
  for (let i = 0; i < n; i++) {
    const amt = Math.round((200 + Math.random() * 1100) * (1 + round * .18) / 50) * 50;
    spawnQ.push({ at: t + .1 + Math.random() * 1.8, amt, life: Math.max(2.8, life * (.7 + Math.random() * .75)), slot: slots[i] });
  }
  spawnQ.sort((a, b) => a.at - b.at);
  state = 'tab';
  for (let i = 0; i < 25; i++) coin(450, 120);
}
function startKick(reason) {
  endReason = reason; state = 'kick'; kickT = 0; kickFlags = {}; coinAcc = 0; shake = 10;
  bills = []; spawnQ = []; combo = 0;
  [0, 160, 320, 480].forEach((d, i) => setTimeout(() => beep(i % 2 ? 700 : 950, .14, 'sawtooth', .07), d));
}
function checkBroke() { if (state === 'tab' && cash <= 0) startKick('bankrupt'); }
function pay(i) {
  const b = bills[i]; if (!b || b.done || state !== 'tab') return;
  const frac = Math.max(0, b.left / b.life);
  const mult = .6 + .9 * frac;                       // 1.5x (instant) .. 0.6x (last second)
  const fast = frac > .45;
  combo = fast ? combo + 1 : 0;
  const bonus = 1 + .1 * Math.min(combo - 1, 5) * (fast ? 1 : 0);
  const back = Math.round(b.amt * mult * bonus);
  cash += back - b.amt; roundNet += back - b.amt;
  b.done = true; b.res = back - b.amt;
  const x = billX(b.slot) + 50;
  floatText(x, 360, (b.res >= 0 ? '+' : '-') + CUR + Math.abs(b.res), b.res >= 0 ? '#7CFF7C' : '#ff6b6b');
  if (combo > 1) floatText(x, 335, 'COMBO x' + combo, '#ffd54a');
  for (let k = 0; k < (b.res >= 0 ? 14 : 4); k++) coin(x, 420);
  beep(b.res >= 0 ? 660 + frac * 500 : 200, .12, 'square', .06);
  checkBroke();
}
function expire(b) {
  const loss = Math.round(b.amt * 1.25);              // late fee
  cash -= loss; roundNet -= loss; combo = 0; shake = 8; b.done = true; b.res = -loss; b.late = true;
  floatText(billX(b.slot) + 50, 360, '-' + CUR + loss + ' LATE', '#ff4040');
  beep(120, .3, 'sawtooth', .08, .5);
}
function billX(i) { return 22 + i * 108; }
function floatText(x, y, s, c) { floats.push({ x, y, s, c, a: 1 }); }
function coin(x, y) { parts.push({ x, y, vx: (Math.random() - .5) * 6, vy: -Math.random() * 7 - 2, life: 1, rot: Math.random() * 6, vr: (Math.random() - .5) * .5, bill: Math.random() < .3 }); }

function update(dt) {
  t += dt; bellAnim = Math.max(0, bellAnim - dt * 1.5); shake = Math.max(0, shake - dt * 25); dispCash += (cash - dispCash) * Math.min(1, dt * 8);
  while (spawnQ.length && spawnQ[0].at <= t) {
    const s = spawnQ.shift(); bills.push({ amt: s.amt, life: s.life, left: s.life, slot: s.slot, done: false }); beep(900, .05, 'triangle', .05);
  }
  if (state === 'tab') {
    for (const b of bills) if (!b.done) { b.left -= dt; if (b.left <= 0) expire(b); }
    checkBroke();
    if (state === 'tab' && !spawnQ.length && bills.length && bills.every(b => b.done)) {
      bills = [];
      if (round >= ROUNDS) {
        if (cash >= START_CASH) {
          state = 'over'; endReason = 'win';
          try { if (cash > best) { best = cash; localStorage.setItem('macattack_best', best); } } catch (e) {}
        } else startKick('poor');
      } else state = 'summary';
    }
  }
  if (state === 'kick') {
    kickT += dt;
    if (kickT > 1.4 && kickT < 3.5) { coinAcc += dt; if (coinAcc > .08) { coinAcc = 0; coin(manPos[0], manPos[1] + 30); } }
    if (kickT > 3.7 && !kickFlags.thud) { kickFlags.thud = true; shake = 22; beep(70, .5, 'sine', .3, .4); beep(55, .6, 'square', .1, .5); }
    if (kickT > 4.9 && !kickFlags.sad) { kickFlags.sad = true; [330, 262, 196, 131].forEach((f, i) => setTimeout(() => beep(f, .35, 'triangle', .1), i * 250)); }
    if (kickT > 7.4) state = 'over';
  }
  for (const f of floats) { f.y -= 30 * dt; f.a -= dt * .7; }
  floats = floats.filter(f => f.a > 0);
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += .4; p.life -= dt * .8; p.rot += p.vr; }
  parts = parts.filter(p => p.life > 0);
}

// ---------- drawing (smooth, lit, post-processed) ----------
cv.width = W * SC; cv.height = H * SC;
const bl1 = document.createElement('canvas'); bl1.width = W / 3; bl1.height = H / 3; const b1 = bl1.getContext('2d');
const bl2 = document.createElement('canvas'); bl2.width = W / 8; bl2.height = H / 8; const b2 = bl2.getContext('2d');
const TAU = Math.PI * 2, UI = '"Trebuchet MS","Segoe UI",system-ui,sans-serif', DISP = 'Impact,"Arial Black",sans-serif';
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function fillRR(x, y, w, h, r, f) { rr(x, y, w, h, r); g.fillStyle = f; g.fill(); }
function lg(x0, y0, x1, y1, st) { const gr = g.createLinearGradient(x0, y0, x1, y1); st.forEach((s, i) => gr.addColorStop(i / (st.length - 1), s)); return gr; }
function rg(x, y, r0, r1, st, x1 = x, y1 = y) { const gr = g.createRadialGradient(x, y, r0, x1, y1, r1); st.forEach((s, i) => gr.addColorStop(i / (st.length - 1), s)); return gr; }
function glow(x, y, r, c, a = 1) {
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = a;
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); g.restore();
}
function ell(x, y, rx, ry, f, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.max(.01, rx), ry, rot, 0, TAU); g.fillStyle = f; g.fill(); }
function limb(x0, y0, x1, y1, w, c) { g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
function txt(s, x, y, size = 16, c = '#fff', al = 'left', gl, font = UI) {
  g.font = `bold ${size}px ${font}`; g.textAlign = al;
  if (gl) { g.shadowColor = gl; g.shadowBlur = size * 1.1; }
  g.fillStyle = c; g.fillText(s, x, y); g.shadowBlur = 0;
}
function neon(s, x, y, size, col, al = 'center', font = DISP) {
  g.font = `${size}px ${font}`; g.textAlign = al;
  g.shadowColor = col; g.shadowBlur = size * 1.4; g.fillStyle = col; g.fillText(s, x, y); g.fillText(s, x, y);
  g.shadowBlur = 0; g.fillStyle = 'rgba(255,255,255,.85)'; g.fillText(s, x, y);
}
function body(x, y, w, h, r, c) {
  fillRR(x, y, w, h, r, c);
  fillRR(x, y, w, h, r, lg(x, y, x + w, y + h, ['rgba(255,255,255,.18)', 'rgba(0,0,0,0)', 'rgba(0,0,0,.45)']));
}
function skinHead(x, y, rx, ry, skin) {
  ell(x, y, rx, ry, rg(x - rx * .35, y - ry * .4, 1, rx * 1.4, [skin, 'rgba(0,0,0,.35)'].map((c, i) => i ? c : c)));
  g.fillStyle = skin; ell(x, y, rx, ry, skin);
  ell(x, y, rx, ry, rg(x - rx * .4, y - ry * .4, 1, rx * 1.5, ['rgba(255,255,255,.25)', 'rgba(0,0,0,.3)']));
}
function glassOfBeer(x, y, s = 1) {
  g.save(); g.translate(x, y); g.scale(s, s);
  fillRR(-6, -20, 12, 20, 2, lg(-6, 0, 6, 0, ['#ffb300', '#ffd54f', '#c77800']));
  fillRR(-7, -24, 14, 6, 3, '#fff'); fillRR(-4, -17, 2, 13, 1, 'rgba(255,255,255,.5)'); g.restore();
}
function bottle(x, y, col, h) {
  fillRR(x, y - h * .62, 14, h * .62, 3, col);
  fillRR(x + 4, y - h, 6, h * .42, 2, col);
  fillRR(x + 3, y - h - 3, 8, 4, 1, '#d4af37');
  fillRR(x, y - h * .62, 14, h * .62, 3, lg(x, 0, x + 14, 0, ['rgba(255,255,255,.4)', 'rgba(255,255,255,0)', 'rgba(0,0,0,.45)']));
  fillRR(x + 1, y - h * .42, 12, h * .22, 1, 'rgba(255,248,225,.85)');
  fillRR(x + 2, y - h * .58, 2, h * .5, 1, 'rgba(255,255,255,.55)');
}
function patron(x, y, shirt, skin, hair, cheer, i) {
  const bob = Math.sin(t * 5 + i * 2) * (cheer ? 4 : 1.2);
  if (cheer) { limb(x - 15, y + 30 + bob, x - 26, y + 4 + bob, 8, skin); limb(x + 15, y + 30 + bob, x + 28, y + 2 + bob, 8, skin); glassOfBeer(x + 28, y + 2 + bob); }
  body(x - 18, y + 22 + bob, 36, 50, 14, shirt);
  skinHead(x, y + 6 + bob, 14, 16, skin);
  ell(x, y - 4 + bob, 15, 9, hair); fillRR(x - 15, y - 4 + bob, 30, 6, 3, hair);
  g.fillStyle = '#111'; ell(x - 5, y + 7 + bob, 2, 2.5, '#111'); ell(x + 5, y + 7 + bob, 2, 2.5, '#111');
  g.strokeStyle = '#5a1a1a'; g.lineWidth = 1.6; g.beginPath(); g.arc(x, y + 11 + bob, cheer ? 5 : 3, .1, Math.PI - .1); g.stroke();
  g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(x - 20, y - 12 + bob, 40, 90);     // depth: patrons sit in shade
}
function cashFan(x, y, rot) {
  for (let i = 0; i < 5; i++) {
    g.save(); g.translate(x, y); g.rotate(rot + (i - 2) * .28);
    fillRR(0, -7, 34, 14, 2, lg(0, -7, 34, 7, ['#3ddc6e', '#1c9c47', '#157a37']));
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1; rr(2, -5, 30, 10, 1); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.7)'; ell(17, 0, 4, 4, 'rgba(255,255,255,.55)');
    g.restore();
  }
}
// Mac: spiky hair, mirror shades, gold chain, loud floral shirt.  mode: stand | carried
function drawMan(cx, cy, mode) {
  const sw = Math.sin(t * 14) * 7, scared = mode !== 'stand', skin = '#e0ac69';
  if (scared) {
    limb(cx - 9, cy + 76, cx - 11, cy + 108, 13, '#1b3a8a'); limb(cx + 9, cy + 76, cx + 9 + sw * .5, cy + 108 + sw * .4, 13, '#1b3a8a');
    fillRR(cx - 20, cy + 106, 18, 9, 4, '#f4f4f4'); fillRR(cx + 1 + sw * .5, cy + 106 + sw * .4, 18, 9, 4, '#f4f4f4');
  }
  body(cx - 22, cy + 36, 44, 42, 13, '#ff8a1f');
  const fl = [[-12, 44, '#fff'], [10, 48, '#ff4fa3'], [-4, 62, '#ffe066'], [14, 66, '#fff'], [-15, 68, '#ff4fa3']];
  fl.forEach(([dx, dy, c]) => { for (let k = 0; k < 5; k++) ell(cx + dx + Math.cos(k * 1.256) * 3.5, cy + dy + Math.sin(k * 1.256) * 3.5, 2.6, 2.6, c); ell(cx + dx, cy + dy, 2, 2, '#e8a000'); });
  g.strokeStyle = '#ffd54a'; g.lineWidth = 2.4; g.beginPath(); g.arc(cx, cy + 36, 10, .2, Math.PI - .2); g.stroke();
  ell(cx, cy + 47, 4, 4, '#ffd54a'); ell(cx - 1, cy + 46, 1.5, 1.5, '#fff');
  if (scared) { limb(cx - 20, cy + 42, cx - 42, cy + 30, 9, skin); limb(cx + 20, cy + 42, cx + 42, cy + 30, 9, skin); }
  else { limb(cx - 20, cy + 42, cx - 30, cy + 66, 9, skin); limb(cx + 20, cy + 42, cx + 36, cy + 34, 9, skin); ell(cx + 37, cy + 34, 5, 5, skin); }
  skinHead(cx, cy + 20, 15, 17, skin);
  g.fillStyle = '#0d0d0d'; g.beginPath();
  g.moveTo(cx - 16, cy + 18); for (let i = 0; i < 6; i++) { g.lineTo(cx - 14 + i * 6, cy - 9 + (i % 2) * 5); g.lineTo(cx - 11 + i * 6, cy + 5); }
  g.lineTo(cx + 16, cy + 18); g.lineTo(cx + 14, cy + 4); g.lineTo(cx - 14, cy + 4); g.closePath(); g.fill();
  fillRR(cx - 15, cy + 15, 13, 8, 3, lg(cx - 15, cy + 15, cx - 2, cy + 23, ['#222', '#000']));
  fillRR(cx + 2, cy + 15, 13, 8, 3, lg(cx + 2, cy + 15, cx + 15, cy + 23, ['#222', '#000']));
  fillRR(cx - 2, cy + 17, 4, 2, 1, '#000');
  g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(cx - 13, cy + 17); g.lineTo(cx - 8, cy + 17); g.moveTo(cx + 4, cy + 17); g.lineTo(cx + 9, cy + 17); g.stroke();
  if (scared) { ell(cx, cy + 30, 5, 4, '#3a0000'); ell(cx, cy + 28.5, 3.5, 1.4, '#fff'); }
  else { g.strokeStyle = '#4a1a10'; g.lineWidth = 2; g.beginPath(); g.arc(cx, cy + 27, 6, .15, Math.PI - .15); g.stroke(); ell(cx, cy + 29, 4, 1.4, '#fff'); }
  ell(cx - 15.5, cy + 24, 1.6, 3, '#ffd54a');                                           // gold earring
}
function drawGuard(cx, y, facing) {
  const sk = '#b5733a';
  limb(cx - 22, y + 38, cx - 30, y + 70, 13, sk); limb(cx + 22, y + 38, cx + 30, y + 70, 13, sk);
  limb(cx - 10, y + 82, cx - 11, y + 116, 15, '#15151f'); limb(cx + 10, y + 82, cx + 11, y + 116, 15, '#15151f');
  fillRR(cx - 20, y + 114, 18, 9, 4, '#050505'); fillRR(cx + 2, y + 114, 18, 9, 4, '#050505');
  body(cx - 26, y + 28, 52, 58, 16, '#161616');
  fillRR(cx - 17, y + 40, 34, 11, 3, '#ffd54a'); txt('SECURITY', cx, y + 48, 6, '#111', 'center');
  limb(cx + facing * 22, y + 36, cx + facing * 40, y + 20, 13, sk);                    // grabbing arm
  skinHead(cx, y + 14, 15, 17, sk);
  fillRR(cx - 17, y - 5, 34, 11, 5, '#111'); fillRR(cx - 12, y + 3, 24, 4, 2, '#000');
  fillRR(cx - 13, y + 11, 26, 7, 3, lg(cx - 13, y + 11, cx + 13, y + 18, ['#333', '#000']));
  g.strokeStyle = '#999'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(cx - facing * 15, y + 20); g.bezierCurveTo(cx - facing * 20, y + 30, cx - facing * 18, y + 34, cx - facing * 14, y + 40); g.stroke();
  g.strokeStyle = '#2a0f0a'; g.lineWidth = 2; g.beginPath(); g.moveTo(cx - 5, y + 26); g.lineTo(cx + 5, y + 26); g.stroke();
}
function drawBar() {
  // wall
  g.fillStyle = lg(0, 0, 0, 290, ['#4a1c2a', '#2a0f18', '#120609']); g.fillRect(0, 0, W, 290);
  for (let i = 0; i < 24; i++) { g.fillStyle = i % 2 ? 'rgba(255,255,255,.025)' : 'rgba(0,0,0,.12)'; g.fillRect(i * 38, 0, 38, 290); }
  // back-lit shelves
  fillRR(40, 28, 820, 138, 8, lg(0, 28, 0, 166, ['rgba(255,170,60,.28)', 'rgba(255,120,40,.10)']));
  const cols = ['#1f8f3a', '#c62828', '#f6a21a', '#1769c9', '#7a2bb5'];
  for (const sy of [96, 160]) {
    for (let i = 0; i < 17; i++) bottle(60 + i * 47, sy, cols[(i + (sy > 100 ? 2 : 0)) % 5], 46 + (i * 7) % 12);
    fillRR(40, sy, 820, 8, 3, lg(0, sy, 0, sy + 8, ['#b07a45', '#5a361b']));
    fillRR(40, sy + 8, 820, 6, 0, 'rgba(0,0,0,.35)');
  }
  // neon
  const fl = .85 + .15 * Math.sin(t * 23) * (Math.sin(t * 3) > .9 ? 1 : 0);
  g.globalAlpha = fl;
  fillRR(54, 172, 122, 36, 6, '#0b2a12'); neon('CHANG', 115, 202, 26, '#39ff6a');
  fillRR(704, 172, 130, 36, 6, '#2a0808'); neon('SINGHA', 769, 202, 26, '#ff5148');
  fillRR(290, 166, 320, 48, 10, '#1c0714'); g.strokeStyle = '#ff4fa3'; g.shadowColor = '#ff4fa3'; g.shadowBlur = 16; g.lineWidth = 3; rr(292, 168, 316, 44, 9); g.stroke(); g.shadowBlur = 0;
  neon('SIAM NIGHTS BAR', 450, 202, 30, Math.floor(t * 2.2) % 5 ? '#ff7ac6' : '#ffd54a');
  g.globalAlpha = 1;
  glow(115, 190, 100, '#1fa845', .35); glow(769, 190, 100, '#c0392b', .35); glow(450, 190, 190, '#ff2d95', .3);
  // exit door
  fillRR(790, 172, 86, 118, 4, '#2a1608'); fillRR(797, 179, 72, 111, 3, lg(797, 0, 869, 0, ['#6b3a18', '#4a2610']));
  ell(851, 240, 4, 4, '#ffd54a'); fillRR(800, 150, 66, 18, 4, '#0b5a1c'); txt('EXIT', 833, 164, 13, '#8dff9d', 'center', '#2dff6a');
  // pendant lamps + light cones
  for (const lx of [180, 450, 720]) {
    g.save(); g.globalCompositeOperation = 'lighter';
    const cone = lg(0, 50, 0, 290, ['rgba(255,190,100,.20)', 'rgba(255,190,100,0)']);
    g.fillStyle = cone; g.beginPath(); g.moveTo(lx - 14, 48); g.lineTo(lx - 150, 290); g.lineTo(lx + 150, 290); g.lineTo(lx + 14, 48); g.fill(); g.restore();
    g.strokeStyle = '#111'; g.lineWidth = 2; g.beginPath(); g.moveTo(lx, 0); g.lineTo(lx, 26); g.stroke();
    g.beginPath(); g.moveTo(lx - 22, 50); g.quadraticCurveTo(lx, 14, lx + 22, 50); g.closePath(); g.fillStyle = lg(lx - 22, 0, lx + 22, 0, ['#e0b050', '#fff1b8', '#8a6420']); g.fill();
    glow(lx, 52, 46, '#ffd9a0', .9);
  }
  // string lights
  for (let i = 0; i < 30; i++) { const x = i * 31, y = 8 + Math.sin(i * .6) * 5, c = ['#ff5252', '#ffd54a', '#4fc3f7', '#69f0ae'][(i + Math.floor(t * 2)) % 4]; ell(x, y, 3.5, 3.5, c); glow(x, y, 16, c, .55); }
  // patrons
  const shirts = ['#c0392b', '#2980b9', '#27ae60', '#8e44ad', '#e67e22'], xs = [80, 220, 330, 570, 700], cheer = state === 'tab' || bellAnim > 0;
  xs.forEach((x, i) => patron(x, 222, shirts[i], ['#f1c27d', '#e0ac69', '#c68642', '#8d5524', '#f1c27d'][i], i % 2 ? '#2a1a10' : '#0d0d0d', cheer, i));
}
function drawCounter() {
  // top + props
  g.fillStyle = lg(0, 283, 0, 312, ['#e0a560', '#a86a30', '#6a3d1a']); g.fillRect(0, 283, W, 29);
  g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(0, 285, W, 2);
  for (const lx of [180, 450, 720]) glow(lx, 297, 120, '#ffd9a0', .25);
  glassOfBeer(140, 297, 1.1); glassOfBeer(300, 297, 1.1); glassOfBeer(540, 300, 1.1); glassOfBeer(790, 297, 1.1);
  fillRR(0, 312, W, 248, 0, lg(0, 312, 0, 560, ['#4a2a15', '#2a150a', '#150a05']));
  for (let i = 0; i < 24; i++) { g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(i * 38, 312, 2, 248); }

function drawFX() {

function drawStreet(s) {
  g.fillStyle = lg(0, 0, 0, 400, ['#05061a', '#14123a', '#3a1a4a']); g.fillRect(0, 0, W, 560);
  for (let i = 0; i < 50; i++) ell((i * 97) % W, (i * 53) % 200, 1.1, 1.1, `rgba(255,255,255,${.3 + .5 * Math.abs(Math.sin(t + i))})`);

  for (let i = 0; i < 9; i++) {
    const h = 130 + (i * 47) % 120, bx = i * 118 + 150; g.fillStyle = lg(0, 330 - h, 0, 330, ['#1c1a44', '#0e0d26']); g.fillRect(bx, 330 - h, 104, h);
    for (let k = 0; k < 8; k++) { const on = (i + k * 3) % 3; g.fillStyle = on ? 'rgba(255,214,120,.8)' : 'rgba(0,0,0,.4)'; g.fillRect(bx + 14 + (k % 2) * 46, 346 - h + Math.floor(k / 2) * 40, 18, 22); if (on) glow(bx + 23 + (k % 2) * 46, 357 - h + Math.floor(k / 2) * 40, 26, '#ffb84a', .25); }
  }
  fillRR(250, 130, 130, 40, 6, '#1c0714'); neon('MASSAGE', 315, 160, 28, '#ff4fa3'); glow(315, 150, 120, '#ff2d95', .3);
  fillRR(560, 100, 130, 40, 6, '#021c20'); neon('PAD THAI', 625, 130, 28, '#3df0ff'); glow(625, 120, 120, '#00bcd4', .3);

  fillRR(14, 332, 190, 30, 6, '#1c0a02'); neon('SIAM NIGHTS', 109, 356, 24, '#ffd54a'); glow(109, 345, 130, '#ffb300', .3);
  fillRR(46, 236, 96, 178, 4, '#2a1608'); fillRR(54, 244, 80, 170, 3, lg(54, 0, 134, 0, ['#d99a46', '#8a5420'])); glow(94, 330, 120, '#ffc870', .35);
  g.fillStyle = lg(0, 400, 0, 560, ['#2b2b38', '#0d0d14']); g.fillRect(0, 400, W, 160);
  g.fillStyle = '#4a4a58'; g.fillRect(0, 400, W, 7);
  for (const [lx, c] of [[110, '#ffb300'], [315, '#ff2d95'], [625, '#00bcd4'], [760, '#a9b8ff']]) { g.save(); g.translate(lx, 440); g.scale(.5, 3); glow(0, 0, 80, c, .3); g.restore(); }
  for (let i = 0; i < 9; i++) fillRR(i * 110 + 20, 505, 62, 7, 2, 'rgba(255,255,255,.55)');
  // tuk-tuk
  g.save(); g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 14;
  fillRR(650, 372, 150, 56, 14, lg(0, 372, 0, 428, ['#ffd84a', '#d99a00'])); g.restore();
  fillRR(664, 334, 112, 44, 12, lg(0, 334, 0, 378, ['#2bbf5a', '#157a37'])); fillRR(728, 342, 40, 28, 6, lg(0, 342, 0, 370, ['#bfe8ff', '#5aa0cc']));
  ell(682, 432, 17, 17, '#0a0a0a'); ell(682, 432, 8, 8, '#777'); ell(768, 432, 17, 17, '#0a0a0a'); ell(768, 432, 8, 8, '#777');
  glow(802, 392, 60, '#fff3b0', .8);
  drawGuard(88, 250, 1); drawGuard(168, 250, -1);
  const u = Math.min(1, s / .8), land = s > .8;
  const x = 150 + 270 * u, y = 290 + 100 * u - Math.sin(Math.PI * u) * 120;
  const bounce = land ? Math.max(0, Math.sin((s - .8) * 14)) * 14 * Math.exp(-(s - .8) * 3) : 0;
  if (!land) for (let k = 1; k < 5; k++) { g.globalAlpha = .12; g.save(); const uu = Math.max(0, u - k * .05); g.translate(150 + 270 * uu, 290 + 100 * uu - Math.sin(Math.PI * uu) * 120 + 40); g.rotate(uu * Math.PI * 2.5); drawMan(0, -40, 'carried'); g.restore(); }
  g.globalAlpha = 1;
  if (land) {                                                                   // scattered cash + dust
    for (let k = 0; k < 7; k++) { g.save(); g.translate(x + Math.sin(k * 12.9) * 90, 440 + Math.sin(k * 7.3) * 20); g.rotate(k); g.globalAlpha = .9; fillRR(-9, -5, 18, 10, 2, '#2ecc71'); g.restore(); }
    const d = s - .8; if (d < .9) { g.globalAlpha = (1 - d / .9) * .5; for (let k = 0; k < 5; k++) ell(x - 60 + k * 30, 448 - d * 20, 14 + d * 40, 8 + d * 14, '#bbb'); g.globalAlpha = 1; }

function drawKick() {

function draw() {
  g.setTransform(SC, 0, 0, SC, 0, 0);

function overlay() {

  if (state === 'title') {
    g.save(); g.shadowColor = '#ff9a00'; g.shadowBlur = 40; g.font = `78px ${DISP}`; g.textAlign = 'center';

function drawOver() {
  const win = endReason === 'win';
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 0, W, H);

function post() {
  // bloom: downsample, square (threshold-ish), add back
  b1.drawImage(cv, 0, 0, bl1.width, bl1.height);
  b1.globalCompositeOperation = 'multiply'; b1.drawImage(bl1, 0, 0); b1.globalCompositeOperation = 'source-over';
  b2.drawImage(bl1, 0, 0, bl2.width, bl2.height);
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.imageSmoothingEnabled = true; g.globalCompositeOperation = 'lighter';
  g.globalAlpha = .4; g.drawImage(bl2, 0, 0, cv.width, cv.height); g.globalAlpha = .22; g.drawImage(bl1, 0, 0, cv.width, cv.height); g.restore();
  // warm grade + vignette
  g.save(); g.setTransform(SC, 0, 0, SC, 0, 0);
  g.fillStyle = rg(W / 2, H / 2, H * .35, H * .85, ['rgba(0,0,0,0)', 'rgba(0,0,0,.6)']); g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'overlay'; g.fillStyle = 'rgba(255,120,60,.10)'; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'source-over'; g.fillStyle = 'rgba(0,0,0,.06)'; for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
  g.restore();
}

// ---------- input ----------
function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
}
cv.addEventListener('pointerdown', e => {
  const [x, y] = canvasPos(e);
  if (state === 'tab') {
    for (let i = 0; i < bills.length; i++) if (x >= billX(bills[i].slot) && x <= billX(bills[i].slot) + 100 && y >= 400 && y <= 530) { pay(i); return; }
    return;
  }
  if (state === 'wait') { if (Math.hypot(x - 640, y - 262) < 70) ringBell(); return; }
  ringBell();
});
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); ringBell(); }
  const n = parseInt(e.key); if (state === 'tab' && n >= 1 && n <= 8) pay(bills.findIndex(b => b.slot === n - 1 && !b.done));
});

newGame(); state = 'title';
let last = performance.now();
(function loop(now) {
  update(Math.max(0, Math.min(.05, (now - last) / 1000))); last = now; draw(); requestAnimationFrame(loop);
})(last);
