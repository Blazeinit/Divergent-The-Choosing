<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Spender</title>
<style>
  html,body{margin:0;background:#120a0a;height:100%;display:flex;align-items:center;justify-content:center;font-family:monospace}
  canvas{max-width:100vw;max-height:100vh;background:#1b0f0f;image-rendering:pixelated;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" width="900" height="560"></canvas>
<script>
// BIG SPENDER — ring the bell, buy the bar a round, then pay every tab FAST.
// Pay quickly = admirers repay you more than the bill. Pay slowly = you lose money.
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 900, H = 560, ROUNDS = 10, START_CASH = 1000;

let state = 'title';           // title | wait | tab | summary | over
let cash, round, combo, bills, floats, parts, bellAnim, t = 0, roundNet, best = 0, spawnQ, msg = '';
try { best = +localStorage.getItem('bigspender_best') || 0; } catch (e) {}

// ---------- audio ----------
let ac;
function beep(f, d = .1, type = 'square', v = .05, slide = 0) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), a = ac.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, ac.currentTime + d);
    a.gain.value = v; a.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.connect(a); a.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
const ding = () => { beep(1568, .6, 'sine', .12); setTimeout(() => beep(2093, .5, 'sine', .08), 60); };

// ---------- game flow ----------
function newGame() {
  cash = START_CASH; round = 0; combo = 0; bills = []; floats = []; parts = []; spawnQ = [];
  bellAnim = 0; roundNet = 0; state = 'wait'; msg = '';
}
function ringBell() {
  if (state === 'title' || state === 'over') { newGame(); return; }
  if (state === 'summary') { state = 'wait'; return; }
  if (state !== 'wait') return;
  round++; roundNet = 0; bellAnim = 1; ding();
  const n = Math.min(2 + round, 8), life = Math.max(3.2, 7.5 - round * .4);
  for (let i = 0; i < n; i++) {
    const amt = Math.round((30 + Math.random() * 90) * (1 + round * .18) / 5) * 5;
    spawnQ.push({ at: t + i * .35, amt, life, who: Math.floor(Math.random() * 6) });
  }
  state = 'tab';
  for (let i = 0; i < 25; i++) coin(450, 120);
}
function pay(i) {
  const b = bills[i]; if (!b || b.done) return;
  const frac = Math.max(0, b.left / b.life);
  const mult = .6 + .9 * frac;                       // 1.5x (instant) .. 0.6x (last second)
  const fast = frac > .45;
  combo = fast ? combo + 1 : 0;
  const bonus = 1 + .1 * Math.min(combo - 1, 5) * (fast ? 1 : 0);
  const back = Math.round(b.amt * mult * bonus);
  cash += back - b.amt; roundNet += back - b.amt;
  b.done = true; b.res = back - b.amt;
  const x = billX(i) + 50;
  floatText(x, 360, (b.res >= 0 ? '+$' : '-$') + Math.abs(b.res), b.res >= 0 ? '#7CFF7C' : '#ff6b6b');
  if (combo > 1) floatText(x, 335, 'COMBO x' + combo, '#ffd54a');
  for (let k = 0; k < (b.res >= 0 ? 14 : 4); k++) coin(x, 420);
  beep(b.res >= 0 ? 660 + frac * 500 : 200, .12, 'square', .06);
}
function expire(b) {
  const loss = Math.round(b.amt * 1.25);              // late fee
  cash -= loss; roundNet -= loss; combo = 0; b.done = true; b.res = -loss; b.late = true;
  floatText(billX(bills.indexOf(b)) + 50, 360, '-$' + loss + ' LATE', '#ff4040');
  beep(120, .3, 'sawtooth', .08, .5);
}
function billX(i) { return 22 + i * 108; }
function floatText(x, y, s, c) { floats.push({ x, y, s, c, a: 1 }); }
function coin(x, y) { parts.push({ x, y, vx: (Math.random() - .5) * 6, vy: -Math.random() * 7 - 2, life: 1 }); }

function update(dt) {
  t += dt; bellAnim = Math.max(0, bellAnim - dt * 1.5);
  while (spawnQ && spawnQ.length && spawnQ[0].at <= t) {
    const s = spawnQ.shift(); bills.push({ amt: s.amt, life: s.life, left: s.life, who: s.who, done: false }); beep(900, .05, 'triangle', .05);
  }
  if (state === 'tab') {
    for (const b of bills) if (!b.done) { b.left -= dt; if (b.left <= 0) expire(b); }
    if (!spawnQ.length && bills.length && bills.every(b => b.done)) {
      setTimeout(() => { bills = []; }, 0);
      state = round >= ROUNDS ? 'over' : 'summary';
      if (cash < 0) state = 'over';
      if (state === 'over') { try { if (cash > best) { best = cash; localStorage.setItem('bigspender_best', best); } } catch (e) {} }
    }
  }
  for (const f of floats) { f.y -= 30 * dt; f.a -= dt * .7; }
  floats = floats.filter(f => f.a > 0);
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += .4; p.life -= dt * .8; }
  parts = parts.filter(p => p.life > 0);
}

// ---------- drawing ----------
const px = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
function txt(s, x, y, size = 16, c = '#fff', al = 'left') {
  g.font = `bold ${size}px monospace`; g.textAlign = al; g.fillStyle = c; g.fillText(s, x, y);
}
function person(x, y, shirt, skin, cheer) {
  const bob = Math.sin(t * 6 + x) * (cheer ? 4 : 1);
  px(x - 14, y + 20 + bob, 28, 34, shirt);
  px(x - 11, y - 4 + bob, 22, 24, skin);
  px(x - 12, y - 8 + bob, 24, 8, '#2a1a10');
  px(x - 6, y + 4 + bob, 3, 3, '#000'); px(x + 4, y + 4 + bob, 3, 3, '#000');
  px(x - 5, y + 12 + bob, 10, cheer ? 4 : 2, '#400');
  if (cheer) { px(x - 22, y + 14 + bob - 8, 8, 20, skin); px(x + 14, y + 14 + bob - 8, 8, 20, skin); }
}
function draw() {
  // back wall + shelves
  px(0, 0, W, 250, '#2a1512');
  for (let i = 0; i < 18; i++) px(i * 50, 0, 2, 250, '#231110');
  for (const sy of [70, 140]) {
    px(40, sy, 820, 6, '#6b4226');
    for (let i = 0; i < 17; i++) {
      const bx = 60 + i * 47, col = ['#2e7d32', '#b71c1c', '#f9a825', '#1565c0', '#6a1b9a'][i % 5];
      px(bx, sy - 38, 14, 38, col); px(bx + 4, sy - 50, 6, 12, col); px(bx + 3, sy - 24, 8, 8, '#fff8');
    }
  }
  px(380, 175, 140, 40, '#ffd54a'); txt('THE GOLDEN TAP', 450, 201, 14, '#3a1f00', 'center');
  // patrons
  const cols = ['#c0392b', '#2980b9', '#27ae60', '#8e44ad', '#e67e22', '#16a085'];
  const cheer = state === 'tab' || bellAnim > 0;
  for (let i = 0; i < 6; i++) person(90 + i * 144 + (i % 2) * 20, 215, cols[i], ['#f1c27d', '#e0ac69', '#c68642', '#8d5524'][i % 4], cheer);
  // bar counter
  px(0, 285, W, 30, '#8b5a2b'); px(0, 285, W, 6, '#c68b4d'); px(0, 315, W, 245, '#3b2314');
  // our big spender (center), flaunting cash
  px(406, 235, 40, 50, '#111'); px(398, 232, 56, 6, '#111');           // suit + top hat brim
  px(412, 200, 28, 38, '#111'); px(412, 226, 28, 5, '#c0392b');
  px(410, 238, 32, 26, '#f1c27d'); px(417, 246, 4, 4, '#000'); px(431, 246, 4, 4, '#000'); px(420, 256, 14, 3, '#400');
  px(434, 250, 14, 3, '#222');                                          // monocle
  const fan = Math.sin(t * 5) * 6;
  for (let i = 0; i < 4; i++) px(458 + i * 7, 236 + fan - i * 3, 24, 12, i % 2 ? '#2ecc71' : '#27ae60');
  txt('$', 478, 247 + fan, 11, '#fff');
  // bell
  const bx = 640, by = 262, sw = Math.sin(bellAnim * 30) * bellAnim * .5;
  g.save(); g.translate(bx, by); g.rotate(sw);
  px(-16, -22, 32, 22, '#ffd54a'); px(-22, -2, 44, 6, '#ffb300'); px(-4, -28, 8, 6, '#ffb300'); g.restore();
  px(bx - 28, by + 4, 56, 6, '#555');
  if (state === 'wait') { txt('RING THE BELL!  (click / SPACE)', bx, by - 42 + Math.sin(t * 5) * 3, 14, '#ffd54a', 'center'); }

  // HUD
  px(0, 0, W, 34, '#000a');
  txt('CASH $' + Math.round(cash), 14, 24, 20, cash < START_CASH * .4 ? '#ff6b6b' : '#7CFF7C');
  txt('ROUND ' + Math.min(round, ROUNDS) + '/' + ROUNDS, W / 2, 24, 18, '#fff', 'center');
  txt('COMBO x' + combo, W - 14, 24, 18, combo > 1 ? '#ffd54a' : '#888', 'right');

  // bills
  for (let i = 0; i < bills.length; i++) {
    const b = bills[i], x = billX(i), y = 400, frac = Math.max(0, b.left / b.life);
    if (b.done) { g.globalAlpha = .35; }
    px(x, y, 100, 130, '#f4ecd8'); px(x, y, 100, 14, '#d9cba5');
    for (let k = 0; k < 4; k++) px(x + 10, y + 50 + k * 10, 80 - (k % 2) * 25, 3, '#bbb');
    txt('TAB ' + (i + 1), x + 50, y + 11, 11, '#555', 'center');
    txt('$' + b.amt, x + 50, y + 38, 22, '#222', 'center');
    if (!b.done) {
      const mult = .6 + .9 * frac;
      px(x + 8, y + 100, 84, 8, '#999');
      px(x + 8, y + 100, 84 * frac, 8, frac > .45 ? '#2ecc71' : frac > .2 ? '#f39c12' : '#e74c3c');
      txt('PAYS ' + mult.toFixed(2) + 'x', x + 50, y + 124, 12, mult >= 1 ? '#1b8a3a' : '#b03a2e', 'center');
    } else txt(b.late ? 'LATE!' : 'PAID', x + 50, y + 124, 13, b.late ? '#c00' : '#1b8a3a', 'center');
    g.globalAlpha = 1;
  }
  if (state === 'tab') txt('CLICK a tab (or press 1-8) — the faster you pay, the more you earn back!', W / 2, 390, 14, '#ffd54a', 'center');

  for (const p of parts) { px(p.x, p.y, 8, 8, '#ffd54a'); px(p.x + 2, p.y + 2, 4, 4, '#ffb300'); }
  for (const f of floats) { g.globalAlpha = Math.max(0, f.a); txt(f.s, f.x, f.y, 20, f.c, 'center'); g.globalAlpha = 1; }

  // overlays
  if (state === 'title' || state === 'over' || state === 'summary') {
    px(0, 0, W, H, '#000b');
    if (state === 'title') {
      txt('BIG SPENDER', W / 2, 190, 56, '#ffd54a', 'center');
      txt('You\'re loaded and the whole bar knows it.', W / 2, 250, 18, '#fff', 'center');
      txt('Ring the bell. Everyone drinks. You foot every tab.', W / 2, 285, 16, '#ddd', 'center');
      txt('Pay FAST = admirers repay you MORE than the bill (up to 1.5x).', W / 2, 315, 16, '#7CFF7C', 'center');
      txt('Pay slow = lose money. Let it expire = 25% late fee.', W / 2, 345, 16, '#ff6b6b', 'center');
      txt('Survive ' + ROUNDS + ' rounds and finish rich.  Best: $' + Math.round(best), W / 2, 390, 16, '#fff', 'center');
      txt('CLICK or SPACE to start', W / 2, 450, 22, '#ffd54a', 'center');
    } else if (state === 'summary') {
      txt('ROUND ' + round + ' SETTLED', W / 2, 220, 40, '#fff', 'center');
      txt((roundNet >= 0 ? 'Net +$' : 'Net -$') + Math.abs(roundNet), W / 2, 280, 32, roundNet >= 0 ? '#7CFF7C' : '#ff6b6b', 'center');
      txt('Cash: $' + Math.round(cash), W / 2, 325, 22, '#fff', 'center');
      txt('CLICK or SPACE for the next round', W / 2, 400, 20, '#ffd54a', 'center');
    } else {
      const won = cash >= START_CASH && round >= ROUNDS, broke = cash < 0;
      txt(broke ? 'BANKRUPT!' : won ? 'BAR LEGEND!' : 'LAST CALL', W / 2, 200, 52, broke ? '#ff6b6b' : '#ffd54a', 'center');
      txt('Final cash: $' + Math.round(cash), W / 2, 260, 28, '#fff', 'center');
      txt(broke ? 'The bouncer shows you the door.' : won ? 'You flexed AND came out ahead.' : 'You left poorer than you came in. Pay faster!', W / 2, 300, 16, '#ddd', 'center');
      txt('Best: $' + Math.round(best), W / 2, 335, 18, '#fff', 'center');
      txt('CLICK or SPACE to play again', W / 2, 410, 22, '#ffd54a', 'center');
    }
  }
}

// ---------- input ----------
function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
}
cv.addEventListener('pointerdown', e => {
  const [x, y] = canvasPos(e);
  if (state === 'tab') {
    for (let i = 0; i < bills.length; i++) if (x >= billX(i) && x <= billX(i) + 100 && y >= 400 && y <= 530) { pay(i); return; }
    return;
  }
  if (state === 'wait') { if (Math.hypot(x - 640, y - 262) < 70) ringBell(); return; }
  ringBell();
});
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); ringBell(); }
  const n = parseInt(e.key); if (state === 'tab' && n >= 1 && n <= 8) pay(n - 1);
});

newGame(); state = 'title';
let last = performance.now();
(function loop(now) {
  update(Math.min(.05, (now - last) / 1000)); last = now; draw(); requestAnimationFrame(loop);
})(last);
</script>
</body>
</html>
